<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Laura Store</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

  <!-- Barra do topo (estilo X): botões redondos sobre o banner;
       ao rolar, mostra nome da loja com fundo desfocado -->
  <header class="topbar" id="topbar">
    <div class="topbar-title" id="topbarTitle">
      <strong id="topbarNome"></strong>
      <span id="topbarSub"></span>
    </div>
    <div class="topbar-actions">
      <button class="circle-btn" data-go="busca" aria-label="Buscar">
        <svg viewBox="0 0 24 24"><path d="M10.25 3.75a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm-8.5 6.5a8.5 8.5 0 1 1 15.176 5.262l4.781 4.781-1.414 1.414-4.781-4.781A8.5 8.5 0 0 1 1.75 10.25z"/></svg>
      </button>
      <button class="circle-btn" id="btnShare" aria-label="Compartilhar">
        <svg viewBox="0 0 24 24"><path d="M12 2.59l5.7 5.7-1.41 1.42L13 6.41V16h-2V6.41l-3.3 3.3-1.41-1.42L12 2.59zM21 15l-.02 3.51c0 1.38-1.12 2.49-2.5 2.49H5.5A2.5 2.5 0 0 1 3 18.5V15h2v3.5c0 .28.22.5.5.5h12.98c.28 0 .5-.22.5-.5L19 15h2z"/></svg>
      </button>
      <button class="circle-btn" id="btnMais" aria-label="Mais opções">
        <svg viewBox="0 0 24 24"><path d="M3 12c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2zm9 2c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm7 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
      </button>
    </div>
  </header>

  <main id="app">
    <!-- ================= INÍCIO ================= -->
    <section class="page" id="page-inicio">
      <div class="banner" id="banner"></div>

      <div class="profile">
        <div class="profile-row">
          <div class="avatar" id="avatar"></div>
          <div class="profile-btns">
            <a class="icon-outline" id="btnZap" target="_blank" rel="noopener" aria-label="WhatsApp">
              <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm0 18.15c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24 4.54 0 8.24 3.7 8.24 8.24 0 4.54-3.7 8.24-8.23 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28z"/></svg>
            </a>
            <button class="follow-btn" id="btnSeguir">Seguir</button>
          </div>
        </div>

        <h1 class="profile-name"><span id="lojaNome"></span><span id="selo"></span></h1>
        <div class="profile-user" id="lojaUser"></div>
        <p class="profile-bio" id="lojaBio"></p>

        <ul class="profile-meta">
          <li><svg viewBox="0 0 24 24"><path d="M12 7c-1.93 0-3.5 1.57-3.5 3.5S10.07 14 12 14s3.5-1.57 3.5-3.5S13.93 7 12 7zm0 5c-.827 0-1.5-.673-1.5-1.5S11.173 9 12 9s1.5.673 1.5 1.5S12.827 12 12 12zm0-10c-4.687 0-8.5 3.813-8.5 8.5 0 5.967 7.621 11.116 7.945 11.332l.555.37.555-.37c.324-.216 7.945-5.365 7.945-11.332C20.5 5.813 16.687 2 12 2zm0 17.77c-1.665-1.241-6.5-5.196-6.5-9.27C5.5 6.916 8.416 4 12 4s6.5 2.916 6.5 6.5c0 4.073-4.835 8.028-6.5 9.27z"/></svg><span id="lojaCidade"></span></li>
          <li><svg viewBox="0 0 24 24"><path d="M18.36 5.64c-1.95-1.96-5.11-1.96-7.07 0L9.88 7.05 8.46 5.64l1.42-1.42c2.73-2.73 7.16-2.73 9.9 0 2.73 2.74 2.73 7.17 0 9.9l-1.42 1.42-1.41-1.42 1.41-1.41c1.96-1.96 1.96-5.12 0-7.07zm-2.12 3.53l-7.07 7.07-1.41-1.41 7.07-7.07 1.41 1.41zm-12.02.71l1.42-1.42 1.41 1.42-1.41 1.41c-1.96 1.96-1.96 5.12 0 7.07 1.95 1.96 5.11 1.96 7.07 0l1.41-1.41 1.42 1.41-1.42 1.42c-2.73 2.73-7.16 2.73-9.9 0-2.73-2.74-2.73-7.17 0-9.9z"/></svg><a id="lojaInsta" target="_blank" rel="noopener"></a></li>
          <li><svg viewBox="0 0 24 24"><path d="M7 4V3h2v1h6V3h2v1h1.5C19.89 4 21 5.12 21 6.5v12c0 1.38-1.11 2.5-2.5 2.5h-13C4.12 21 3 19.88 3 18.5v-12C3 5.12 4.12 4 5.5 4H7zm0 2H5.5c-.27 0-.5.22-.5.5v12c0 .28.23.5.5.5h13c.28 0 .5-.22.5-.5v-12c0-.28-.22-.5-.5-.5H17v1h-2V6H9v1H7V6zm0 6h2v-2H7v2zm0 4h2v-2H7v2zm4-4h2v-2h-2v2zm0 4h2v-2h-2v2zm4-4h2v-2h-2v2z"/></svg><span id="lojaDesde"></span></li>
        </ul>

        <div class="profile-stats" id="lojaNumeros"></div>
      </div>

      <!-- Abas estilo X -->
      <nav class="tabs" id="tabs" aria-label="Categorias"></nav>

      <div id="fixado"></div>
      <div class="grid" id="gridInicio"></div>
    </section>

    <!-- ================= BUSCA ================= -->
    <section class="page" id="page-busca" hidden>
      <div class="page-head">
        <h2>Busca</h2>
        <label class="search-box">
          <svg viewBox="0 0 24 24"><path d="M10.25 3.75a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm-8.5 6.5a8.5 8.5 0 1 1 15.176 5.262l4.781 4.781-1.414 1.414-4.781-4.781A8.5 8.5 0 0 1 1.75 10.25z"/></svg>
          <input type="search" id="buscaInput" placeholder="Buscar produtos" autocomplete="off">
        </label>
        <div class="chips" id="buscaChips"></div>
      </div>
      <div id="buscaInfo" class="muted pad"></div>
      <div class="grid" id="gridBusca"></div>
    </section>

    <!-- ================= CARRINHO ================= -->
    <section class="page" id="page-carrinho" hidden>
      <div class="page-head"><h2>Carrinho</h2></div>
      <div id="carrinhoConteudo"></div>
    </section>

    <!-- ================= PEDIDOS ================= -->
    <section class="page" id="page-pedidos" hidden>
      <div class="page-head"><h2>Meus pedidos</h2></div>
      <div id="pedidosConteudo"></div>
    </section>

    <!-- ================= PERFIL ================= -->
    <section class="page" id="page-perfil" hidden>
      <div class="page-head"><h2>Perfil</h2></div>
      <div id="perfilConteudo"></div>
    </section>
  </main>

  <!-- Barra "Ver carrinho" (estilo sacola do iFood) -->
  <button class="cart-bar" id="cartBar" hidden>
    <span class="cart-bar-icon">
      <svg viewBox="0 0 24 24"><path d="M7 8V7a5 5 0 0 1 10 0v1h2.2a1 1 0 0 1 1 .92l1 12A1 1 0 0 1 20.2 23H3.8a1 1 0 0 1-1-1.08l1-12A1 1 0 0 1 4.8 9H7zm2 0h6V7a3 3 0 0 0-6 0v1z"/></svg>
      <b id="cartBarQtd">0</b>
    </span>
    <span>Ver carrinho</span>
    <span id="cartBarTotal">R$ 0,00</span>
  </button>

  <!-- Menu de baixo (estilo iFood) -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Navegação principal">
    <button data-tab="inicio" class="active">
      <svg class="i-off" viewBox="0 0 24 24"><path d="M12 3.2 2.8 11l1.3 1.5L5 11.7V20a1 1 0 0 0 1 1h5v-6h2v6h5a1 1 0 0 0 1-1v-8.3l.9.8 1.3-1.5L12 3.2zM17 19h-2v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5H7V10l5-4.2 5 4.2v9z"/></svg>
      <svg class="i-on" viewBox="0 0 24 24"><path d="M12 3.2 2.8 11l1.3 1.5L5 11.7V20a1 1 0 0 0 1 1h4.5v-6h3v6H18a1 1 0 0 0 1-1v-8.3l.9.8 1.3-1.5L12 3.2z"/></svg>
      <span>Início</span>
    </button>
    <button data-tab="busca">
      <svg class="i-off" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
      <svg class="i-on" viewBox="0 0 24 24"><path d="M10.5 2.5a8 8 0 0 1 6.5 12.6l4.6 4.6-1.9 1.9-4.6-4.6A8 8 0 1 1 10.5 2.5zm0 2.7a5.3 5.3 0 1 0 0 10.6 5.3 5.3 0 0 0 0-10.6z"/></svg>
      <span>Busca</span>
    </button>
    <button data-tab="carrinho" id="navCarrinho">
      <span class="nav-badge" id="navBadge" hidden>0</span>
      <svg class="i-off" viewBox="0 0 24 24"><path d="M7 8V7a5 5 0 0 1 10 0v1h2.2a1 1 0 0 1 1 .92l1 12A1 1 0 0 1 20.2 23H3.8a1 1 0 0 1-1-1.08l1-12A1 1 0 0 1 4.8 9H7zm0 2H5.72l-.83 11h14.22l-.83-11H17v2h-2v-2H9v2H7v-2zm2-2h6V7a3 3 0 0 0-6 0v1z"/></svg>
      <svg class="i-on" viewBox="0 0 24 24"><path d="M7 8V7a5 5 0 0 1 10 0v1h2.2a1 1 0 0 1 1 .92l1 12A1 1 0 0 1 20.2 23H3.8a1 1 0 0 1-1-1.08l1-12A1 1 0 0 1 4.8 9H7zm2 0h6V7a3 3 0 0 0-6 0v1zm-2 2v2h2v-2H7zm8 0v2h2v-2h-2z"/></svg>
      <span>Carrinho</span>
    </button>
    <button data-tab="pedidos">
      <svg class="i-off" viewBox="0 0 24 24"><path d="M5 2h14a1 1 0 0 1 1 1v19l-3-2-2.5 2L12 20l-2.5 2L7 20l-3 2V3a1 1 0 0 1 1-1zm1 2v14.3l1-.7 2.5 2 2.5-2 2.5 2 2.5-2 1 .7V4H6zm2 3h8v2H8V7zm0 4h8v2H8v-2z"/></svg>
      <svg class="i-on" viewBox="0 0 24 24"><path d="M5 2h14a1 1 0 0 1 1 1v19l-3-2-2.5 2L12 20l-2.5 2L7 20l-3 2V3a1 1 0 0 1 1-1zm3 5v2h8V7H8zm0 4v2h8v-2H8z"/></svg>
      <span>Pedidos</span>
    </button>
    <button data-tab="perfil">
      <svg class="i-off" viewBox="0 0 24 24"><path d="M12 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 10c4.4 0 8 2.7 8 6v2H4v-2c0-3.3 3.6-6 8-6zm0 2c-3.1 0-5.6 1.6-6 4h12c-.4-2.4-2.9-4-6-4z"/></svg>
      <svg class="i-on" viewBox="0 0 24 24"><path d="M12 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 12c4.4 0 8 2.7 8 6v2H4v-2c0-3.3 3.6-6 8-6z"/></svg>
      <span>Perfil</span>
    </button>
  </nav>

  <!-- Camada das janelas (produto, finalizar, detalhes) -->
  <div id="overlays"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
